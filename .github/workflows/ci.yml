name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Stage 1: each component in isolation
  api-service:
    name: API service · Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + unit tests
        run: ./mvnw -B verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-service-tests
          path: |
            services/api-service/target/surefire-reports/TEST-*.xml
            services/api-service/target/failsafe-reports/TEST-*.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-service-coverage
          path: services/api-service/target/site/jacoco/
