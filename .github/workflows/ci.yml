name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Stage 1: each component in isolation
  api-service:
    name: API service · Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + unit tests + integration tests (embedded PostgreSQL & Kafka) + coverage gate
        run: ./mvnw -B verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-service-tests
          path: |
            services/api-service/target/surefire-reports/TEST-*.xml
            services/api-service/target/failsafe-reports/TEST-*.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-service-coverage
          path: services/api-service/target/site/jacoco/

  triage-service:
    name: Triage service · Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/triage-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/triage-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint + format check
        run: ruff check src tests && ruff format --check src tests
      - name: Tests + coverage gate
        run: pytest --junitxml=reports/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-service-tests
          path: services/triage-service/reports/junit.xml

  dashboard:
    name: Dashboard · React
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit/component tests + coverage gate
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Type check + production build
        run: npm run build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-tests
          path: dashboard/reports/junit.xml

  k8s-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Render with kustomize and validate against the Kubernetes API schemas
        run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:latest -strict -summary /work/rendered.yaml

  # ---------------------------------------------------------------- Stage 2: the whole system, as users see it
  system-tests:
    name: System tests · docker compose
    needs: [api-service, triage-service, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build images and start the stack (Postgres, Redis, Kafka, API, triage, dashboard)
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qa/e2e-tests/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Event pipeline · API → outbox → Kafka → triage
        run: python scripts/verify_event_pipeline.py

      - name: API acceptance tests · Cucumber + REST Assured
        working-directory: qa/api-tests
        env:
          FLAKEHUNTER_API_URL: http://localhost:8080
        run: ./mvnw -B test

      - name: Install Playwright
        working-directory: qa/e2e-tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: End-to-end tests · Playwright
        working-directory: qa/e2e-tests
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8080
        run: npx playwright test

      - uses: grafana/setup-k6-action@v1
      - name: Load test · k6 (fails the build if the performance budget is exceeded)
        run: k6 run -e DURATION=30s -e UPLOADS_PER_SECOND=5 -e READ_VUS=10 qa/performance/load-test.js

      - name: Collect unit test results from stage 1
        if: success() || failure()
        uses: actions/download-artifact@v8
        with:
          path: reports
          pattern: '*-tests'

      - name: Dogfooding · FlakeHunter analyses its own test results
        if: success() || failure()
        continue-on-error: true
        run: >-
          python scripts/dogfood.py
          --commit "$GITHUB_SHA" --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --build-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "reports/**/*.xml" "qa/api-tests/target/cucumber-junit.xml" "qa/e2e-tests/test-results/junit.xml"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload test reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-reports
          path: |
            qa/e2e-tests/playwright-report/
            qa/api-tests/target/cucumber-report.html

      - name: Stop the stack
        if: always()
        run: docker compose down -v
