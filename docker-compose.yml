# Full FlakeHunter stack on one machine:
#   docker compose up -d --build --wait
#   python scripts/seed_demo.py          # optional demo data
#   open http://localhost:3000           # dashboard
#        http://localhost:8080/swagger-ui.html   # API docs
#        http://localhost:8000/docs      # triage API docs

name: flakehunter

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flakehunter
      POSTGRES_PASSWORD: flakehunter
      POSTGRES_DB: flakehunter
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flakehunter -d flakehunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # Single-node KRaft (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  api:
    build: ./services/api-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flakehunter
      DB_USERNAME: flakehunter
      DB_PASSWORD: flakehunter
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Generous limits so the load test measures the service, not the rate limiter.
      FLAKEHUNTER_RATELIMIT_CAPACITY: 5000
      FLAKEHUNTER_RATELIMIT_REFILLPERSECOND: 1000
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      # The JRE image has no curl, so use bash's built-in /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  triage:
    build: ./services/triage-service
    environment:
      TRIAGE_DATABASE_URL: postgresql+psycopg://flakehunter:flakehunter@postgres:5432/triage
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Optional: export ANTHROPIC_API_KEY before `docker compose up` to enable Claude triage.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }

  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      api: { condition: service_healthy }
      triage: { condition: service_healthy }

volumes:
  pgdata:
